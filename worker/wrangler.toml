name = "three-statement-engine"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[triggers]
crons = ["0 6 * * *"]

[assets]
directory = "../out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__scheduled"]

# Replace the id with the real namespace before the first deploy: wrangler kv namespace create RATES
[[kv_namespaces]]
binding = "RATES"
id = "00000000000000000000000000000000"
